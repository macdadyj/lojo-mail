name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [[ -d /Applications/Xcode_26.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Archive script self-test
        run: ios/scripts/archive-upload.sh --self-test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Unit tests
        id: test
        run: |
          set -euo pipefail
          VECTORS="$(mktemp -d "${RUNNER_TEMP}/lojo-mail-vectors.XXXXXX")"
          npx tsx ios/CoreTests/make-vectors.ts "${VECTORS}"
          export LOJO_VECTORS="${VECTORS}"
          UDID="$(python3 - <<'PY'
          import json, subprocess
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          data = json.loads(raw)
          chosen = ""
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("name", "").startswith("iPhone") and device.get("isAvailable", True):
                      chosen = device["udid"]
          if not chosen:
              raise SystemExit("No available iPhone simulator")
          print(chosen)
          PY
          )"
          echo "udid=${UDID}" >> "$GITHUB_OUTPUT"
          xcodebuild test \
            -project ios/LojoMail.xcodeproj \
            -scheme LojoMail \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM=""

  # Phone taps every screen. TestFlight waits for this job.
  phone-ui:
    runs-on: macos-26
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [[ -d /Applications/Xcode_26.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Phone UI tests
        working-directory: ios
        run: scripts/phone-ui-test.sh

      - name: Upload phone UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: phone-ui-screenshots
          path: ios/build/phone-ui-screenshots
          if-no-files-found: warn

  testflight:
    needs: [ios, phone-ui]
    if: github.event_name != 'pull_request'
    concurrency:
      group: testflight-${{ github.repository }}
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [[ -d /Applications/Xcode_26.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Archive script self-test
        run: ios/scripts/archive-upload.sh --self-test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Unit tests
        run: |
          set -euo pipefail
          VECTORS="$(mktemp -d "${RUNNER_TEMP}/lojo-mail-vectors.XXXXXX")"
          npx tsx ios/CoreTests/make-vectors.ts "${VECTORS}"
          export LOJO_VECTORS="${VECTORS}"
          UDID="$(python3 - <<'PY'
          import json, subprocess
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          data = json.loads(raw)
          chosen = ""
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("name", "").startswith("iPhone") and device.get("isAvailable", True):
                      chosen = device["udid"]
          if not chosen:
              raise SystemExit("No available iPhone simulator")
          print(chosen)
          PY
          )"
          xcodebuild test \
            -project ios/LojoMail.xcodeproj \
            -scheme LojoMail \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM=""

      - name: Archive and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: ios/scripts/archive-upload.sh

      - name: Delete temporary signing keychain
        if: always()
        run: ios/scripts/cleanup-signing-keychain.sh
