name: LojoMail
options:
  bundleIdPrefix: com.lojo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  LojoMailCore:
    type: framework
    platform: iOS
    sources:
      - path: App/Sources/LojoMailCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.Mail.core
        PRODUCT_NAME: LojoMailCore
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SKIP_INSTALL: YES

  LojoMail:
    type: application
    platform: iOS
    sources:
      - path: App/Sources/LojoMail
      - path: App/Resources
        excludes:
          - AppIcon.png
    dependencies:
      - target: LojoMailCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.Mail
        PRODUCT_NAME: LojoMail
        INFOPLIST_FILE: App/Info-xcode.plist
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES

  LojoMailTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoreTests/Tests/LojoMailCoreTests
    dependencies:
      - target: LojoMailCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.Mail.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

  LojoMailUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: LojoMail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.Mail.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LojoMail
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

schemes:
  LojoMail:
    build:
      targets:
        LojoMail: all
        LojoMailCore: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LojoMailTests
    archive:
      config: Release
      customArchiveName: LojoMail
  LojoMailUI:
    build:
      targets:
        LojoMail: all
        LojoMailUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LojoMailUITests
